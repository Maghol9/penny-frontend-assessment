<header class="app-header">
	<h1>Change Request Review</h1>
	<div class="app-header__controls">
	<label>
		Acting as:
		<select (change)="switchUser($any($event.target).value)">
			<option *ngFor="let key of userKeys" [value]="key" [selected]="session.user.id === users[key]?.id">{{ key }}</option>
		</select>
	</label>
	<button type="button" class="app-header__simulate-error" (click)="simulateListError()">Demo: fail list load</button>
	</div>
</header>

<main class="app-layout" *ngIf="show">
	<app-cr-list (select)="onSelect($event)"></app-cr-list>
	<app-cr-detail *ngIf="selectedId" [id]="selectedId" (changed)="onChanged()"></app-cr-detail>
</main>
